<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remothing admin</title>
<style>
  :root { color-scheme: dark; --bg: #15171a; --panel: #1e2126; --line: #2e333a; --fg: #e6e6e6; --dim: #9aa1aa;
    --accent: #4c9aff; --ok: #3fb950; --warn: #d29922; --err: #f85149; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  nav { display: flex; gap: 4px; flex: 1; }
  nav button { background: none; border: 1px solid transparent; color: var(--dim); }
  nav button.active { color: var(--fg); border-color: var(--line); background: var(--bg); }
  main { padding: 16px 20px; max-width: 1400px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px;
    margin-bottom: 16px; }
  section h2 { font-size: 14px; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; }
  ul.plain { margin: 0; padding-left: 16px; }
  button { background: #2b3039; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px;
    font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  button:disabled, select:disabled { opacity: .45; cursor: default; border-color: var(--line); }
  input, select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 8px; font: inherit; }
  input[type=number] { width: 110px; }
  form.grid { display: grid; grid-template-columns: max-content minmax(0, 520px); gap: 8px 16px; align-items: center; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 12px; border: 1px solid var(--line); }
  .badge.virtual { color: var(--warn); border-color: var(--warn); }
  .badge.real { color: var(--ok); border-color: var(--ok); }
  .badge.current { color: #fff; background: var(--accent); border-color: var(--accent); }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
  .bar { display: inline-block; width: 120px; height: 8px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 4px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  #banner { margin: 0 0 16px; padding: 8px 12px; border-radius: 4px; white-space: pre-wrap; }
  #banner.error { background: rgba(248,81,73,.15); border: 1px solid var(--err); }
  #banner.info { background: rgba(63,185,80,.12); border: 1px solid var(--ok); }
  #banner.warn { background: rgba(210,153,34,.15); border: 1px solid var(--warn); }
  #login { max-width: 380px; margin: 12vh auto; }
  #login form { display: grid; gap: 10px; }
  .err { color: var(--err); }
</style>
</head>
<body>
<div id="login-view" hidden>
  <section id="login">
    <h2>remothing admin</h2>
    <form id="login-form">
      <label class="row"><input type="radio" name="kind" value="token" checked> Admin token
        <input type="radio" name="kind" value="password"> Password</label>
      <input id="login-secret" type="password" autocomplete="current-password" placeholder="Admin token" required>
      <button class="primary" type="submit">Log in</button>
      <div id="login-error" class="err"></div>
    </form>
  </section>
</div>
<div id="app-view" hidden>
  <header>
    <h1>remothing</h1>
    <nav>
      <button data-tab="status" class="active">Status</button>
      <button data-tab="displays">Displays</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <button id="logout">Log out</button>
  </header>
  <main>
    <div id="banner" hidden></div>
    <div id="tab-status"></div>
    <div id="tab-displays" hidden></div>
    <div id="tab-settings" hidden></div>
  </main>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
