<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Phones lay the page out at their own width: the picture is fitted by main.ts, not by page zoom. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>remothing</title>
<style>
  /* Touch drives the remote pointer, on the picture and around it: the browser must not pan or zoom the page with it. */
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; }
  #screen { display: block; margin: 0 auto; outline: none; touch-action: none; }
  /* The remote cursor, drawn for touch input (main.ts). */
  #pointer { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 1; }
  #stats { position: fixed; right: 8px; bottom: 8px; padding: 6px 8px; font: 12px/1.35 ui-monospace, monospace;
    color: #eee; background: rgba(0,0,0,.7); white-space: pre; pointer-events: none; border-radius: 4px; }

  #ui { font: 13px/1.3 system-ui, sans-serif; color: #eee; }
  #ui button, #ui select { font: inherit; color: inherit; background: #2a2d33; border: 1px solid #454a54;
    border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #ui button.on { background: #3b6ea8; border-color: #5a8fca; }
  /* Barely visible until needed: it sits over the remote screen. */
  #ui-handle { position: fixed; top: 0; left: 50%; transform: translateX(-50%); opacity: .35;
    border-radius: 0 0 6px 6px !important; border-top: 0 !important; padding: 0 14px !important; z-index: 2; }
  #ui-handle:hover { opacity: 1; }
  #ui-bar { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
    align-items: center; padding: 6px; background: rgba(24,26,30,.95); border: 1px solid #454a54;
    border-radius: 6px; max-width: calc(100vw - 16px); flex-wrap: wrap; justify-content: center; z-index: 2; }
  #ui-bar[hidden], #ui-clipboard[hidden], #ui-keyboard[hidden] { display: none; }
  #ui-bar select { max-width: 40vw; }
  #ui-clipboard { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 2;
    width: min(560px, calc(100vw - 16px)); }
  #ui-clipboard textarea { display: block; box-sizing: border-box; width: 100%; height: 120px; resize: vertical;
    font: 13px/1.35 ui-monospace, monospace; color: #eee; background: rgba(24,26,30,.95);
    border: 1px solid #454a54; border-radius: 6px; padding: 8px; }
  #ui-keyboard { position: fixed; left: 0; right: 0; bottom: 0; padding: 4px; background: #1b1d21;
    border-top: 1px solid #454a54; display: flex; flex-direction: column; gap: 3px; touch-action: none;
    user-select: none; -webkit-user-select: none; z-index: 1; }
  .kb-row { display: flex; gap: 3px; }
  #ui .kb-key { flex: 1 1 0; min-width: 0; height: min(44px, 7vh); padding: 0; overflow: hidden; }
  #ui .kb-key.down { background: #3b6ea8; border-color: #5a8fca; }
  #ui .kb-layout { flex: 1.25 1 0; color: #9ab; }
  /* Focused to open a phone's keyboard, never seen. 16px: smaller text makes iOS zoom in on focus. */
  #ui-text { position: fixed; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0;
    font-size: 16px; resize: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<canvas id="pointer" hidden></canvas>
<div id="stats" hidden></div>
<div id="ui"></div>
<script type="module" src="main.js"></script>
</body>
</html>
