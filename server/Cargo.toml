[package]
name = "remothing-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
ffmpeg-next = { version = "7", default-features = false, features = ["codec", "format", "software-scaling"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code", "damage", "xfixes", "xtest", "shm"] }
