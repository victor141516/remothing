[package]
name = "remothing-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rust-embed = { version = "8", features = ["mime-guess"] }
sha2 = "0.10"
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["set-header"] }
# WebRTC (data channels over UDP); pure-Rust crypto keeps the Windows build static.
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
if-addrs = "0.13"
zstd = { version = "0.13", default-features = false }
# Self-signed TLS certificate (already built for str0m's DTLS, same backend).
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
time = "0.3"
# WebTransport (HTTP/3 over QUIC): frames as datagrams. `quinn` exposes the
# QUIC layer underneath, for our own congestion controller.
wtransport = { version = "0.7", default-features = false, features = ["ring", "quinn"] }
